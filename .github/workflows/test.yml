name: Test
on: [ push ]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
    - name: Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
    - name: Format
      run: cargo fmt -- --check
    - name: Lint
      run: cargo clippy --no-deps -- -D warnings
    - name: Build
      run: cargo build
    - name: Test
      run: cargo test
