name: Test
on: [ push ]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-12]
    steps:
    - name: Checkout
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
    - name: Format
      run: cargo fmt -- --check
    - name: Lint
      run: cargo clippy -- --no-deps
    - name: Build
      run: cargo build
    - name: Test
      run: cargo test
