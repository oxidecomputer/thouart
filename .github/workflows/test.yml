name: Test
on: [ push ]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Format
      run: cargo fmt -- --check
    - name: Lint
      run: cargo clippy --no-deps -- -D warnings
    - name: Build
      run: cargo build
    - name: Test
      run: cargo test
