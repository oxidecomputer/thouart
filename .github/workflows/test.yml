name: Test
on: [ push ]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: Format
      run: cargo fmt -- --check
    - name: Lint
      run: cargo clippy --no-deps -- -D warnings
    - name: Build
      run: cargo build
    - name: Test
      run: cargo test
